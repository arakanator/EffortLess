name: Verified native rebuild
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: UCRT64
          update: true
          cache: false
          install: >-
            git curl make patch diffutils tar unzip libarchive
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-libass
            mingw-w64-ucrt-x86_64-libplacebo
            mingw-w64-ucrt-x86_64-dav1d
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-libvpx
            mingw-w64-ucrt-x86_64-libvorbis
            mingw-w64-ucrt-x86_64-uchardet
            mingw-w64-ucrt-x86_64-lcms2
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-libiconv
            mingw-w64-ucrt-x86_64-ccache
      - name: Restore compiler object cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .cache/native-ccache
          key: windows-native-ccache-v1-${{ github.run_id }}
          restore-keys: windows-native-ccache-v1-
      - name: Verify source-signature bridge before compilation
        shell: msys2 {0}
        run: |
          mkdir -p .cache/signature-probe
          curl --fail --location --output .cache/signature-probe/source.tar.zst https://mirror.msys2.org/mingw/sources/mingw-w64-brotli-1.2.1-1.src.tar.zst
          curl --fail --location --output .cache/signature-probe/source.tar.zst.sig https://mirror.msys2.org/mingw/sources/mingw-w64-brotli-1.2.1-1.src.tar.zst.sig
          python -c "import sys;sys.path.insert(0,'native/rebuild');from pathlib import Path;from collect import verify_source;verify_source(Path('.cache/signature-probe/source.tar.zst'));print('Trusted MSYS2 source-signature verification passed')"
      - name: Lock installed native build inputs
        id: package-lock
        shell: msys2 {0}
        run: echo "sha=$(pacman -Q | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Restore tested native compilation state
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .cache/native-rebuild/ffmpeg
            .cache/native-rebuild/mpv
            .cache/native-rebuild/prefix
            .cache/native-rebuild/records
            .cache/native-rebuild/compiled-complete
            .cache/native-rebuild/compiled-binaries.sha256
          key: native-tested-v1-${{ steps.package-lock.outputs.sha }}-${{ hashFiles('native/rebuild/build.sh') }}-${{ github.run_id }}
          restore-keys: native-tested-v1-${{ steps.package-lock.outputs.sha }}-${{ hashFiles('native/rebuild/build.sh') }}-
      - name: Build LGPL-compatible libmpv and FFmpeg; collect sources
        shell: msys2 {0}
        run: bash native/rebuild/build.sh
      - name: Save tested native compilation state
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .cache/native-rebuild/ffmpeg
            .cache/native-rebuild/mpv
            .cache/native-rebuild/prefix
            .cache/native-rebuild/records
            .cache/native-rebuild/compiled-complete
            .cache/native-rebuild/compiled-binaries.sha256
          key: native-tested-v1-${{ steps.package-lock.outputs.sha }}-${{ hashFiles('native/rebuild/build.sh') }}-${{ github.run_id }}
      - name: Save compiler objects for bounded retries
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .cache/native-ccache
          key: windows-native-ccache-v1-${{ github.run_id }}
      - name: Build logs (no binaries on failure)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-build-logs
          path: .cache/native-rebuild/records
          retention-days: 14
          if-no-files-found: warn
      - name: Native candidate and matching source materials
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-candidate-with-sources
          path: .cache/native-rebuild/result
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
